<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Telemetría LIPU">
  <!-- Icono app "Evaluación de Conductores" — paleta pedida por el cliente:
       base #D0DF00 (lima) + #63666A (gris TRAXION) + detalles finos #FFFFFF. -->
  <rect width="512" height="512" rx="112" fill="#D0DF00"/>
  <!-- gauge en gris sobre lima -->
  <path d="M 100 306 A 160 160 0 1 1 412 306" fill="none" stroke="#63666A" stroke-width="44" stroke-linecap="round" opacity=".28"/>
  <path d="M 100 306 A 160 160 0 0 1 298 112" fill="none" stroke="#63666A" stroke-width="44" stroke-linecap="round"/>
  <!-- marcas finas blancas del dial -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <line x1="256" y1="96"  x2="256" y2="120"/>
    <line x1="140" y1="160" x2="158" y2="176"/>
    <line x1="372" y1="160" x2="354" y2="176"/>
  </g>
  <!-- aguja gris con filo blanco -->
  <g transform="rotate(36 256 296)">
    <path d="M 256 296 L 256 140" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
    <path d="M 256 296 L 256 146" stroke="#63666A" stroke-width="18" stroke-linecap="round"/>
  </g>
  <circle cx="256" cy="296" r="36" fill="#63666A"/>
  <circle cx="256" cy="296" r="14" fill="#FFFFFF"/>
  <!-- pulso de telemetría en gris con remate blanco -->
  <path d="M 104 414 h 78 l 26 -42 34 78 30 -56 18 20 h 118" fill="none" stroke="#63666A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 208 372 l 34 78 30 -56" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
</svg>
